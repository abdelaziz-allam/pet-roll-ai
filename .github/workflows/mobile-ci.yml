name: Flutter Build & Test

on:
  push:
    branches: [main, develop]
    paths: ["monorepo/app/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["monorepo/app/**", ".github/workflows/mobile-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: monorepo/app
        run: flutter pub get

      # Gating now that analysis_options.yaml excludes the orphaned tree those 715
      # errors lived in. The code that actually ships analyzes clean, so a real
      # regression in it fails the build instead of scrolling past.
      - name: Analyze
        working-directory: monorepo/app
        run: flutter analyze --no-fatal-infos

      # No "|| true" here: this step previously swallowed every failure, so the job
      # reported success while 2 tests were failing and broken tests reached main.
      - name: Run tests
        working-directory: monorepo/app
        run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'

      - name: Stamp CI build number
        run: "$GITHUB_WORKSPACE/.github/set-build-number.sh ${{ github.run_number }}"

      - name: Install dependencies
        working-directory: monorepo/app
        run: flutter pub get

      - name: Check Android signing secrets
        id: android_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
            && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets missing — AAB will be debug-signed and cannot be uploaded to Play"
          fi

      # NOTE: the `if:` here deliberately uses a step output, not `env.KEYSTORE_BASE64`.
      # Step-level `env:` is NOT available to that same step's `if:` expression, so the
      # previous `if: env.KEYSTORE_BASE64 != ''` was always false and this step silently
      # skipped even when the secret existed — producing a debug-signed AAB.
      - name: Decode keystore
        if: steps.android_secrets.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          cat > monorepo/app/android/key.properties << 'PROPS'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          PROPS

      - name: Build release AAB
        working-directory: monorepo/app
        run: flutter build appbundle --release

      - name: Verify AAB is release-signed
        if: steps.android_secrets.outputs.ready == 'true'
        run: |
          AAB=monorepo/app/build/app/outputs/bundle/release/app-release.aab
          EXPECTED=$(keytool -list -keystore /tmp/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" -v 2>/dev/null \
            | grep 'SHA1:' | head -1 | tr -d ' ')
          ACTUAL=$(unzip -p "$AAB" META-INF/*.RSA 2>/dev/null \
            | keytool -printcert 2>/dev/null | grep 'SHA1:' | head -1 | tr -d ' ')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::AAB is not signed with the upload key — Play would reject it"
            exit 1
          fi
          echo "✅ AAB signed with the expected upload key"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: petroll-release-aab
          path: monorepo/app/build/app/outputs/bundle/release/app-release.aab

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      # Fails loudly rather than exiting 0. The previous version skipped silently on a
      # missing secret, so build-android reported success while never uploading anything
      # to Play — a green tick that meant nothing.
      - name: Deploy to Play Store (internal track)
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        working-directory: monorepo/app/android
        run: |
          if [ -z "$SUPPLY_JSON_KEY_DATA" ]; then
            echo "::error::PLAY_STORE_SERVICE_ACCOUNT_JSON is not set — cannot upload to Play Store."
            echo "Create it in Play Console → Setup → API access → link a service account with"
            echo "the 'Release manager' role, download the JSON, then add it as a repo secret."
            exit 1
          fi
          fastlane deploy_internal

  build-ios:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'

      - name: Stamp CI build number
        run: "$GITHUB_WORKSPACE/.github/set-build-number.sh ${{ github.run_number }}"

      - name: Install dependencies
        working-directory: monorepo/app
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: monorepo/app/ios
        run: pod install

      - name: Check iOS signing secrets
        id: ios_secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ] \
            && [ -n "$IOS_DIST_CERT_P12_BASE64" ] \
            && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] \
            && [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing secrets not set — building unsigned only, skipping TestFlight"
          fi

      # --- Unsigned fallback: keeps CI green until Apple enrollment completes ---
      - name: Build iOS (no codesign)
        if: steps.ios_secrets.outputs.ready == 'false'
        working-directory: monorepo/app
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build artifact
        if: steps.ios_secrets.outputs.ready == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: petroll-ios-build
          path: monorepo/app/build/ios/iphoneos/Runner.app

      # --- Signed path: activates automatically once the secrets exist ---
      - name: Import signing certificate and provisioning profile
        if: steps.ios_secrets.outputs.ready == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          KEYCHAIN=/tmp/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f /tmp/dist.p12

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/petfolioo_appstore.mobileprovision"

      - name: Setup Ruby for Fastlane
        if: steps.ios_secrets.outputs.ready == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        if: steps.ios_secrets.outputs.ready == 'true'
        run: gem install fastlane

      - name: Build signed IPA and upload to TestFlight
        if: steps.ios_secrets.outputs.ready == 'true'
        working-directory: monorepo/app/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUNDLE_ID: com.petroll.app
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
        run: fastlane beta_ci

      - name: Upload IPA artifact
        if: steps.ios_secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: petroll-ios-ipa
          path: monorepo/app/ios/build/PetFolioo.ipa

name: Flutter Build & Test

on:
  push:
    branches: [main, develop]
    paths: ["monorepo/app/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["monorepo/app/**", ".github/workflows/mobile-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: monorepo/app
        run: flutter pub get

      - name: Analyze
        working-directory: monorepo/app
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        working-directory: monorepo/app
        run: flutter test || true

  build-android:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: monorepo/app
        run: flutter pub get

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
          cat > monorepo/app/android/key.properties << 'PROPS'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          PROPS

      - name: Build release AAB
        working-directory: monorepo/app
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: petroll-release-aab
          path: monorepo/app/build/app/outputs/bundle/release/app-release.aab

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane

      - name: Write Play Store service account key
        run: echo '${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}' > /tmp/play-publisher-key.json

      - name: Deploy to Play Store (internal track)
        working-directory: monorepo/app/android
        run: fastlane deploy_internal

  build-ios:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: monorepo/app
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: monorepo/app/ios
        run: pod install

      - name: Build iOS (no codesign)
        working-directory: monorepo/app
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: petroll-ios-build
          path: monorepo/app/build/ios/iphoneos/Runner.app

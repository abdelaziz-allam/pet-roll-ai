name: Azure Container Apps rollout
description: >
  Points one container app at an image that is already in the environment's registry, waits for the
  new revision to provision, and smoke-tests it. Expects an az login for that environment.

inputs:
  environment:
    description: stage or prod
    required: true
  app:
    description: api, landing or admin
    required: true
  image:
    description: Full image reference in the environment's registry
    required: true

runs:
  using: composite
  steps:
    - name: Roll out ${{ inputs.app }}
      shell: bash
      env:
        # Stage runs in North Europe (neu), prod in Sweden Central (swc); see azure/envs/*/main.tf.
        RG: rg-petfolioo-${{ inputs.environment }}-${{ inputs.environment == 'stage' && 'neu' || 'swc' }}
        APP: ca-petfolioo-${{ inputs.environment }}-${{ inputs.environment == 'stage' && 'neu' || 'swc' }}-${{ inputs.app }}
        IMAGE: ${{ inputs.image }}
        APP_KEY: ${{ inputs.app }}
      run: |
        set -euo pipefail
        # Only the image changes. Settings and secret references are owned by Terraform
        # (azure/modules/environment), so a release cannot drop or alter configuration. No custom
        # revision suffix either: Terraform resends the current one when it changes settings,
        # and Azure rejects a suffix that already exists.
        az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" -o none

        rev=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
        state=unknown
        for _ in $(seq 1 60); do
          state=$(az containerapp revision show -n "$APP" -g "$RG" --revision "$rev" --query properties.provisioningState -o tsv)
          echo "  $rev: $state"
          case "$state" in
            Provisioned) break ;;
            Failed) echo "::error::$rev failed to provision - see the app's system logs"; exit 1 ;;
          esac
          sleep 10
        done
        [ "$state" = "Provisioned" ] || { echo "::error::$rev did not provision within 10 minutes"; exit 1; }

        # Provisioned is not proof the app starts (stage scales to zero), so wake it with a request.
        # The API must answer its health check; the websites must serve their home page.
        fqdn=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
        if [ "$APP_KEY" = api ]; then path=/health; else path=/; fi
        code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --retry 5 --retry-delay 10 --retry-all-errors "https://$fqdn$path" || echo 000)
        echo "### $APP_KEY (${{ inputs.environment }}): https://$fqdn$path -> $code" >> "$GITHUB_STEP_SUMMARY"
        echo "https://$fqdn$path -> $code"
        case "$code" in 2*|3*) ;; *) echo "::error::$APP_KEY answered $code"; exit 1 ;; esac

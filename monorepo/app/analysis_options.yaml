# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

analyzer:
  # Excluded: an orphaned parallel implementation (riverpod providers, go_router,
  # and a core/network + core/storage layer) that the "revert(mobile): restore
  # mobile app to stable 80600d6 state" commit stranded. Nothing reachable from
  # lib/main.dart or the tests imports any of it, and its dependencies are not in
  # pubspec.yaml, so it never reaches a build — but it does produce 715 analyzer
  # errors, which is why `flutter analyze` had to be run with "|| true".
  #
  # Excluding it lets analyze gate CI on the code that actually ships: the
  # reachable set currently has ZERO analyzer errors. This is deliberately NOT a
  # deletion — that tree still holds unshipped work (chat, reports, schedules,
  # onboarding, notifications) with no equivalent in the shipped app.
  #
  # When that tree is either rewired or removed, delete the matching lines below.
  exclude:
    - lib/core/network/**
    - lib/core/router/**
    - lib/core/storage/**
    - lib/core/utils/**
    - lib/features/auth/providers/**
    - lib/features/auth/screens/**
    - lib/features/auth/services/**
    - lib/features/chat/models/**
    - lib/features/chat/providers/**
    - lib/features/chat/screens/**
    - lib/features/chat/services/**
    - lib/features/health/providers/**
    - lib/features/health/services/**
    - lib/features/home/models/**
    - lib/features/home/providers/**
    - lib/features/home/screens/**
    - lib/features/home/services/**
    - lib/features/mating/models/**
    - lib/features/mating/providers/**
    - lib/features/mating/services/**
    - lib/features/notifications/models/**
    - lib/features/notifications/providers/**
    - lib/features/notifications/screens/**
    - lib/features/notifications/services/**
    - lib/features/onboarding/screens/**
    - lib/features/pets/providers/**
    - lib/features/pets/services/**
    - lib/features/pregnancy/providers/**
    - lib/features/pregnancy/services/**
    - lib/features/reports/providers/**
    - lib/features/reports/screens/**
    - lib/features/reports/services/**
    - lib/features/schedules/models/**
    - lib/features/schedules/providers/**
    - lib/features/schedules/screens/**
    - lib/features/schedules/services/**
    - lib/features/vaccination/providers/**
    - lib/features/vaccination/services/**
    - lib/core/theme/app_colors.dart
    - lib/core/theme/app_typography.dart
    - lib/core/widgets/app_button.dart
    - lib/core/widgets/app_text_field.dart

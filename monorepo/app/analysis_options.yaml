    - lib/core/widgets/error_view.dart
    - lib/core/widgets/loading_indicator.dart
    - lib/core/widgets/shimmer_loading.dart
    - lib/features/health/screens/add_health_record_screen.dart
    - lib/features/mating/screens/breeder_rankings_screen.dart
    - lib/features/mating/screens/create_listing_screen.dart
    - lib/features/mating/screens/match_requests_screen.dart
    - lib/features/mating/screens/mating_detail_screen.dart
